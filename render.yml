services:
  # Backend Web Service (Node.js + Express + Prisma)
  - type: web
    name: hms-backend
    runtime: node
    rootDir: server
    buildCommand: npm install && npx prisma db push && npm run prisma:seed && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        value: file:./dev.db
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: "*"

  # Frontend Static Site (React + Vite + Tailwind CSS)
  - type: static
    name: hms-frontend
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
